plugins {
    id 'com.android.application'
}

android {
    namespace 'ua.ilabfree.mobile'
    compileSdk 34

    defaultConfig {
        applicationId "ua.ilabfree.mobile"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "0.1"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
