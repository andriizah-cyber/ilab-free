name: Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Копіюємо веб-інтерфейс у застосунок
        run: |
          python3 - <<'PY'
          src = open("docs/index.html", encoding="utf-8").read()
          tag = '<script src="android_ble.js"></script>\n<script>\n"use strict";'
          assert '<script>\n"use strict";' in src
          open("android/app/src/main/assets/index.html", "w", encoding="utf-8").write(
              src.replace('<script>\n"use strict";', tag, 1))
          PY

      - name: Збирання APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Перейменування
        run: cp android/app/build/outputs/apk/debug/app-debug.apk iLabFree.apk

      - uses: actions/upload-artifact@v4
        with:
          name: iLabFree-apk
          path: iLabFree.apk
